[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teamwork-engine"
version = "0.1.0"
description = "High-speed closed-loop 5-stage Mega-Prompt protocol engine for AI coding agents."
readme = "README.md"
authors = [{ name = "Teamwork Preview Team" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["multi-agent", "mega-prompt", "closed-loop", "code-generation", "evaluation"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
teamwork = "teamwork_engine.cli:main"
teamwork-engine = "teamwork_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["teamwork_engine*"]

[tool.setuptools.package-data]
teamwork_engine = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=teamwork_engine --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["teamwork_engine"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
